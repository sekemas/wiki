# Local PostgreSQL for Openpedia development.
#
# `docker compose up -d` starts a PostgreSQL 16 server whose data lives in the
# named volume below, so it survives `docker compose stop`/`down`. `docker
# compose down -v` deletes the volume — the next `bun run setup` then rebuilds
# the schema from the committed migrations and re-seeds.
#
# The connection string this serves is the DATABASE_URL in .env.example. There is
# deliberately no committed .env: export DATABASE_URL in your shell instead,
# because a .env file in this directory would shadow the platform's own
# DATABASE_URL on the deployed site.
services:
  postgres:
    image: postgres:16
    container_name: openpedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: openpedia
      POSTGRES_PASSWORD: openpedia
      POSTGRES_DB: openpedia
    ports:
      - "5432:5432"
    volumes:
      - openpedia-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `docker compose up -d --wait` (used by scripts/ensure-postgres.sh) blocks
      # until this passes, so migrations never run against a starting server.
      test: ["CMD-SHELL", "pg_isready -U openpedia -d openpedia"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  openpedia-postgres-data:
